# Para el administrador del OTRO equipo Nginx.
# Insertar dentro del server HTTPS existente de salud1.dyndns.org.
# Conservar sus certificados y el resto de las aplicaciones del dominio.
location = /infancias {
    return 302 /infancias/;
}

location /infancias/ {
    # Sin / final: no quitar /infancias/ al reenviar.
    proxy_pass http://192.168.64.49:7451;
    proxy_set_header Host salud1.dyndns.org;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    client_max_body_size 40m;
    proxy_read_timeout 120s;
    access_log off;
}
