# Instalar en /etc/nginx/sites-available/infancias-internal.
# Solo para acceso desde la red interna; no publicar 7451 en Internet.
# Este map va en el contexto http (sites-enabled suele incluirse allí).
# Reemplazar el marcador por la IP de origen REAL del proxy, no la del navegador.
# Sin reemplazarlo, no se confía en ninguna cabecera HTTPS reenviada.
map "$remote_addr:$http_x_forwarded_proto" $infancias_scheme {
    default $scheme;
    "REEMPLAZAR_IP_PROXY:https" https;
}

server {
    listen 192.168.64.49:7451;
    server_name 192.168.64.49 salud1.dyndns.org;

    location = / {
        return 302 /infancias/buscar;
    }

    include /etc/nginx/snippets/infancias.locations.conf;

    location / {
        return 404;
    }
}
