# Incluir dentro del server interno :7451, después de definir el map de confianza.
# Sin / final en proxy_pass: se conserva el prefijo /infancias/.
location = /infancias {
    return 302 /infancias/buscar;
}

location /infancias/ {
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $infancias_scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    client_max_body_size 40m;
    proxy_read_timeout 120s;
    # Las URL de consulta pueden contener datos personales.
    access_log off;
}
